<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة دلتا - الخزنة</title>
<style>
*{margin:0; padding:0; box-sizing:border-box;}
body {font-family: Tahoma; background:#0a0a0f; color:#eee; min-height:100vh; position:relative;}
body::before {
  content:'DELTA';
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:25vw; font-weight:900; color:rgba(102,126,234,0.05);
  z-index:0; letter-spacing:20px; pointer-events:none;
}
.container {position:relative; z-index:1; padding:20px; max-width:1200px; margin:0 auto;}
h1 {text-align:center; color:#667eea; font-size:32px; margin-bottom:10px; text-shadow:0 0 20px #667eea;}
.subtitle {text-align:center; color:#aaa; margin-bottom:30px;}

.tabs {display:flex; gap:15px; margin-bottom:30px; flex-wrap:wrap;}
.tab {flex:1; min-width:180px; padding:20px; background:linear-gradient(135deg,#1a1d24,#222838); border:2px solid #333; color:#aaa; border-radius:20px; cursor:pointer; font-size:18px; font-weight:bold; text-align:center; transition:0.3s;}
.tab:hover {transform:translateY(-5px); border-color:#667eea;}
.tab.active {background:linear-gradient(135deg,#667eea,#764ba2); color:white; border-color:#667eea; box-shadow:0 0 30px rgba(102,126,234,0.5);}
.tab span {display:block; font-size:12px; font-weight:normal; margin-top:5px;}

.tab-content {display:none;}
.tab-content.active {display:block;}
#search, #searchServer, #searchCig {width:100%; padding:15px 25px; border-radius:50px; border:2px solid #667eea; background:#1a1d24; color:#fff; font-size:18px; margin-bottom:25px;}

.grid {display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:20px;}
.card {background:#1a1d24; border-radius:15px; padding:20px; border:1px solid #2a2f3a; cursor:pointer; transition:0.3s;}
.card:hover {border-color:#667eea; transform:translateY(-3px);}
.card-header {display:flex; justify-content:space-between; align-items:center;}
.card h3 {color:#667eea; font-size:20px;}
.card-details {display:none; margin-top:15px; padding-top:15px; border-top:1px solid #333;}
.card.active .card-details {display:block;}
.ip {background:#0f1117; padding:10px; border-radius:8px; color:#25D366; font-family: monospace; direction:ltr; margin:8px 0; font-size:16px;}
.stats {display:flex; gap:10px; margin:10px 0;}
.stat {flex:1; background:#0f1117; padding:10px; border-radius:8px; text-align:center;}
.stat b {color:#667eea; display:block; font-size:22px;}
button {background:#667eea; color:white; border:none; padding:15px; border-radius:10px; width:100%; margin-top:15px; cursor:pointer; font-size:16px; font-weight:bold;}
.del {background:#c0392b; width:auto; padding:10px 20px; font-size:14px;}
.smoke-btn {background:#27ae60; padding:8px 15px; width:auto; margin:5px;}
input {width:100%; padding:12px; margin:10px 0; background:#0f1117; border:1px solid #333; color:#fff; border-radius:10px; font-size:16px;}
.add-form {background:#1a1d24; padding:25px; border-radius:20px; margin-top:25px; border:1px solid #2a2f3a;}
.add-form h3 {color:#667eea; margin-bottom:15px;}
.arrow {transition:0.3s; display:inline-block;}
.card.active .arrow {transform:rotate(90deg);}
</style>
</head>
<body>
<div class="container">

<h1>شركة دلتا</h1>
<p class="subtitle">نظام الادارة</p>

<div class="tabs">
  <button class="tab active" id="tabDishes" onclick="showTab('dishes')">
    📡 الصحون
    <span>ادارة صحون الاستقبال</span>
  </button>
  <button class="tab" id="tabServers" onclick="showTab('servers')">
    🖥️ السيرفرات
    <span>ادارة السيرفرات والايبيات</span>
  </button>
  <button class="tab" id="tabCigs" onclick="showTab('cigs')">
    🚬 الدخان
    <span>متابعة الباكيتات</span>
  </button>
</div>

<!-- تبويب الصحون -->
<div id="dishes" class="tab-content active">
  <input type="text" id="search" placeholder="ابحث باسم الصحن او المكان...">
  <div class="grid" id="gridDishes"></div>
  <div class="add-form">
    <h3>اضافة صحن جديد</h3>
    <input type="text" id="dishName" placeholder="اسم الصحن">
    <input type="text" id="dishIP" placeholder="الاي بي: 192.168.1.1">
    <input type="text" id="dishLocation" placeholder="المكان: سطح البيت - حلب">
    <button onclick="addDish()">+ حفظ الصحن</button>
  </div>
</div>

<!-- تبويب السيرفرات -->
<div id="servers" class="tab-content">
  <input type="text" id="searchServer" placeholder="ابحث باسم السيرفر او المكان...">
  <div class="grid" id="gridServers"></div>
  <div class="add-form">
    <h3>اضافة سيرفر جديد</h3>
    <input type="text" id="serverName" placeholder="اسم السيرفر">
    <input type="text" id="serverIP" placeholder="الاي بي: 10.0.0.5">
    <input type="text" id="serverLocation" placeholder="المكان: غرفة السيرفرات">
    <button onclick="addServer()">+ حفظ السيرفر</button>
  </div>
</div>

<!-- تبويب الدخان -->
<div id="cigs" class="tab-content">
  <input type="text" id="searchCig" placeholder="ابحث باسم الباكيت...">
  <div class="grid" id="gridCigs"></div>
  <div class="add-form">
    <h3>اضافة باكيت جديد</h3>
    <input type="text" id="cigName" placeholder="اسم الباكيت: ميريت ازرق">
    <input type="number" id="cigTotal" placeholder="عدد السكاير بالباكيت: 20">
    <input type="number" id="cigPrice" placeholder="السعر: 50000 ل.س">
    <button onclick="addCig()">+ فتح باكيت جديد</button>
  </div>
</div>

</div>

<script>
let dishes = JSON.parse(localStorage.getItem('dishes') || '[]');
let servers = JSON.parse(localStorage.getItem('servers') || '[]');
let cigs = JSON.parse(localStorage.getItem('cigs') || '[]');

function showTab(id){
  document.getElementById('tabDishes').classList.remove('active');
  document.getElementById('tabServers').classList.remove('active');
  document.getElementById('tabCigs').classList.remove('active');
  document.getElementById('dishes').classList.remove('active');
  document.getElementById('servers').classList.remove('active');
  document.getElementById('cigs').classList.remove('active');
  
  if(id === 'dishes'){
    document.getElementById('tabDishes').classList.add('active');
    document.getElementById('dishes').classList.add('active');
  } else if(id === 'servers'){
    document.getElementById('tabServers').classList.add('active');
    document.getElementById('servers').classList.add('active');
  } else {
    document.getElementById('tabCigs').classList.add('active');
    document.getElementById('cigs').classList.add('active');
  }
}

function toggleCard(card){
  card.classList.toggle('active');
}

function renderDishes(list = dishes){
  document.getElementById('gridDishes').innerHTML = list.map((d,i)=>`
    <div class="card" onclick="toggleCard(this)">
      <div class="card-header">
        <h3>📡 ${d.name}</h3>
        <span class="arrow">▶</span>
      </div>
      <div class="card-details">
        <p><b>الاي بي:</b> <div class="ip">${d.ip}</div></p>
        <p><b>المكان:</b> ${d.location}</p>
        <button class="del" onclick="event.stopPropagation(); delDish(${i})">حذف</button>
      </div>
    </div>
  `).join('');
}

function renderServers(list = servers){
  document.getElementById('gridServers').innerHTML = list.map((s,i)=>`
    <div class="card" onclick="toggleCard(this)">
      <div class="card-header">
        <h3>🖥️ ${s.name}</h3>
        <span class="arrow">▶</span>
      </div>
      <div class="card-details">
        <p><b>الاي بي:</b> <div class="ip">${s.ip}</div></p>
        <p><b>المكان:</b> ${s.location}</p>
        <button class="del" onclick="event.stopPropagation(); delServer(${i})">حذف</button>
      </div>
    </div>
  `).join('');
}

function renderCigs(list = cigs){
  document.getElementById('gridCigs').innerHTML = list.map((c,i)=>`
    <div class="card" onclick="toggleCard(this)">
      <div class="card-header">
        <h3>🚬 ${c.name}</h3>
        <span class="arrow">▶</span>
      </div>
      <div class="card-details">
        <div class="stats">
          <div class="stat"><b>${c.total}</b>اشتريت</div>
          <div class="stat"><b>${c.smoked}</b>دخنت</div>
          <div class="stat"><b>${c.total - c.smoked}</b>باقي</div>
        </div>
        <p><b>السعر:</b> ${c.price} ل.س</p>
        <button class="smoke-btn" onclick="event.stopPropagation(); smoke
